<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="desktop">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">◈</span>
        <span>AESTHETIC BROWSER</span>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        VISUAL ARCHIVE
      </div>
    </header>

    <section class="welcome">
      <p class="eyebrow">YOUR PERSONAL VISUAL ARCHIVE</p>
      <h1>Explore an aesthetic.</h1>
      <p class="subtitle">
        A collection of digital art, visual experiments, and internet culture.
      </p>
    </section>

    <section class="collections">
      <button class="collection-card memphis" type="button">
        <span class="card-number">01 / COLLECTION</span>
        <span class="card-art">◢ ● ◈</span>
        <span class="card-title">Memphis Milano</span>
        <span class="card-description">Colorful shapes &amp; playful geometry</span>
        <span class="card-action">EXPLORE ↗</span>
      </button>

      <button class="collection-card vaporwave" type="button">
        <span class="card-number">02 / COLLECTION</span>
        <span class="card-art">☼ ▦ ◇</span>
        <span class="card-title">Vaporwave</span>
        <span class="card-description">Digital nostalgia &amp; neon dreams</span>
        <span class="card-action">EXPLORE ↗</span>
      </button>

      <button class="collection-card aero" type="button">
        <span class="card-number">03 / COLLECTION</span>
        <span class="card-art">◉ ≋ ❋</span>
        <span class="card-title">Frutiger Aero</span>
        <span class="card-description">Glossy blues, nature &amp; optimism</span>
        <span class="card-action">EXPLORE ↗</span>
      </button>
    </section>

    <footer class="footer">
      <span>AB.EXE — VERSION 1.0</span>
      <span>MADE FOR THE CURIOUS.</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
